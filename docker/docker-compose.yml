services:
  api:
    image: dbvault-api:latest
    network_mode: host
    environment:
      DBVAULT_ENV: prod
      DBVAULT_DATABASE_URL: postgresql+psycopg://dbvault:${DBVAULT_POSTGRES_PASSWORD:?set DBVAULT_POSTGRES_PASSWORD}@127.0.0.1:15432/dbvault
      DBVAULT_REDIS_URL: redis://127.0.0.1:16379/0
      DBVAULT_JWT_SECRET: ${DBVAULT_JWT_SECRET:?set DBVAULT_JWT_SECRET}
      DBVAULT_ENCRYPTION_KEY: ${DBVAULT_ENCRYPTION_KEY:?set DBVAULT_ENCRYPTION_KEY}
      DBVAULT_BACKUP_TMP_DIR: /var/lib/dbvault/tmp
      DBVAULT_LOCAL_STORAGE_ROOT: /var/lib/dbvault/backups
      DBVAULT_KUBECONFIG_DIR: /var/lib/dbvault/kubeconfigs
      DBVAULT_ENABLE_REGISTRATION: ${DBVAULT_ENABLE_REGISTRATION:-false}
    volumes:
      - dbvault-data:/var/lib/dbvault
    depends_on:
      - postgres
      - redis
      # - minio

  frontend:
    image: dbvault-frontend:latest
    network_mode: host
    depends_on:
      - api

  postgres:
    image: postgres:16
    network_mode: host
    command: postgres -p 15432
    environment:
      POSTGRES_DB: dbvault
      POSTGRES_USER: dbvault
      POSTGRES_PASSWORD: ${DBVAULT_POSTGRES_PASSWORD:?set DBVAULT_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    network_mode: host
    command: redis-server --port 16379

  minio:
    image: minio/minio:latest
    profiles: ["integration"]
    network_mode: host
    command: server /data --address ":19000" --console-address ":19001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  mysql-source:
    image: mysql:8.4
    profiles: ["integration"]
    network_mode: host
    command: --port=13306 --bind-address=0.0.0.0 --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MYSQL_DATABASE: orders
      MYSQL_USER: backup
      MYSQL_PASSWORD: backup-password
    volumes:
      - mysql-source-data:/var/lib/mysql

  postgres-source:
    image: postgres:16
    profiles: ["integration"]
    network_mode: host
    command: postgres -p 15433
    environment:
      POSTGRES_DB: reports
      POSTGRES_USER: backup
      POSTGRES_PASSWORD: backup-password
    volumes:
      - postgres-source-data:/var/lib/postgresql/data

volumes:
  dbvault-data:
  postgres-data:
  minio-data:
  mysql-source-data:
  postgres-source-data:
