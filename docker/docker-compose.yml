services:
  api:
    image: dbvault-api:latest
    network_mode: host
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DBVAULT_ENV: dev
      DBVAULT_DATABASE_URL: postgresql+psycopg://dbvault:dbvault@127.0.0.1:15432/dbvault
      DBVAULT_REDIS_URL: redis://127.0.0.1:16379/0
      DBVAULT_JWT_SECRET: local-development-secret
      DBVAULT_BACKUP_TMP_DIR: /var/lib/dbvault/tmp
      DBVAULT_LOCAL_STORAGE_ROOT: /var/lib/dbvault/backups
      DBVAULT_KUBECONFIG_DIR: /var/lib/dbvault/kubeconfigs
      DBVAULT_ENABLE_REGISTRATION: "true"
    volumes:
      - ..:/app
      - dbvault-data:/var/lib/dbvault
    depends_on:
      - postgres
      - redis
      # - minio

  frontend:
    image: dbvault-frontend:latest
    network_mode: host
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - api

  postgres:
    image: postgres:16
    network_mode: host
    command: postgres -p 15432
    environment:
      POSTGRES_DB: dbvault
      POSTGRES_USER: dbvault
      POSTGRES_PASSWORD: dbvault
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    network_mode: host
    command: redis-server --port 16379

  # minio:
