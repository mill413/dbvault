services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DBVAULT_ENV: dev
      DBVAULT_DATABASE_URL: postgresql+psycopg://dbvault:dbvault@postgres:5432/dbvault
      DBVAULT_REDIS_URL: redis://redis:6379/0
      DBVAULT_JWT_SECRET: local-development-secret
      DBVAULT_BACKUP_TMP_DIR: /var/lib/dbvault/tmp
      DBVAULT_LOCAL_STORAGE_ROOT: /var/lib/dbvault/backups
    volumes:
      - .:/app
      - dbvault-data:/var/lib/dbvault
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dbvault
      POSTGRES_USER: dbvault
      POSTGRES_PASSWORD: dbvault
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  dbvault-data:
  postgres-data:
  minio-data:

