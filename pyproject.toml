[project]
name = "dbvault"
version = "0.1.0"
description = "DBVault database backup backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "apscheduler>=3.10.4",
    "bcrypt>=4.1.3",
    "boto3>=1.34.140",
    "cryptography>=42.0.8",
    "email-validator>=2.2.0",
    "fastapi>=0.111.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.3.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.31",
    "structlog>=24.2.0",
    "uvicorn[standard]>=0.30.1",
    "zstandard>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker-backed external services",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
